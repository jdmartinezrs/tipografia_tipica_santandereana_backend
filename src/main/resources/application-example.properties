spring.application.name=demo
spring.datasource.url=jdbc:postgresql://localhost:5432/tipografia_tipica_santander
spring.datasource.username=juan_admin
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}
app.auth.max-failed-attempts=${AUTH_MAX_FAILED_ATTEMPTS:5}
app.auth.lock-minutes=${AUTH_LOCK_MINUTES:15}
app.auth.cleanup-delay-ms=${AUTH_CLEANUP_DELAY_MS:3600000}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
server.tomcat.basedir=target/tomcat
